<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHELON // COMMAND_CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; background: #050505; color: #16FF00; overflow: hidden; }
        .scanline { width: 100%; height: 2px; background: rgba(22, 255, 0, 0.1); position: absolute; animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .crt-overlay { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 3px, 3px 100%; pointer-events: none; position: fixed; inset: 0; z-index: 50; }
        .nav-active { color: white; border-left: 2px solid #16FF00; padding-left: 10px; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="crt-overlay"></div>

    <div class="flex h-screen p-2 border-4 border-[#16FF00]/10">
        <nav class="w-72 border-r border-[#16FF00]/20 bg-[#080808] p-8 flex flex-col justify-between z-10">
            <div>
                <div class="mb-12 border-b border-[#16FF00]/20 pb-4">
                    <h1 class="text-2xl font-black italic tracking-tighter">AGENT_JASON</h1>
                    <p class="text-[10px] text-white/40 tracking-[0.2em]">IDENT_VERIFIED // ECHELON</p>
                </div>
                <ul class="space-y-6" id="main-nav">
                    <li><button onclick="loadSection('home', this)" class="nav-active uppercase text-sm tracking-widest flex items-center space-x-2"><span>01</span> <span>Latest Intel</span></button></li>
                    <li><button onclick="loadSection('about', this)" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity"><span>02</span> <span>Agent Bio</span></button></li>
                    <li><button onclick="loadSection('certs', this)" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity"><span>03</span> <span>Clearance</span></button></li>
                    <li><button onclick="loadSection('projects', this)" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity"><span>04</span> <span>Blacklist Ops</span></button></li>
                    <li><button onclick="loadSection('activities', this)" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity"><span>05</span> <span>Field Logs</span></button></li>
                </ul>
            </div>
            <div class="text-[9px] opacity-30">UPLINK: STABLE // PH_NODE_03</div>
        </nav>

        <main id="content-display" class="flex-1 bg-[#0a0a0a] p-12 overflow-y-auto relative z-10">
            </main>
    </div>

    <script>
        async function loadSection(sectionName, element) {
            // Update UI Active State
            document.querySelectorAll('#main-nav button').forEach(btn => btn.classList.remove('nav-active', 'opacity-100'));
            document.querySelectorAll('#main-nav button').forEach(btn => btn.classList.add('opacity-60'));
            element.classList.add('nav-active', 'opacity-100');
            element.classList.remove('opacity-60');

            // Fetch and Inject Content
            try {
                const response = await fetch(`sections/${sectionName}.html`);
                const html = await response.text();
                document.getElementById('content-display').innerHTML = html;
                console.log(`[SYS] File loaded: ${sectionName}.html`);
            } catch (err) {
                document.getElementById('content-display').innerHTML = `<p class="text-red-500">ERROR: FAILED_TO_RETRIEVE_${sectionName.toUpperCase()}_DATA</p>`;
            }
        }

        // Initial Load
        window.onload = () => {
            const firstBtn = document.querySelector('#main-nav button');
            loadSection('home', firstBtn);
        };
    </script>
</body>
</html>
