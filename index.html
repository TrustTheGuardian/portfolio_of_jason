<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECHELON // COMMAND_CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'JetBrains Mono', monospace; background: #050505; color: #16FF00; overflow: hidden; }
        
        /* SCANLINE EFFECT */
        .scanline { width: 100%; height: 2px; background: rgba(22, 255, 0, 0.1); position: absolute; animation: scan 4s linear infinite; z-index: 100; pointer-events: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        
        /* CRT OVERLAY */
        .crt-overlay { background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 3px, 3px 100%; pointer-events: none; position: fixed; inset: 0; z-index: 50; }
        
        /* ACTIVE NAV STATE */
        .nav-active { color: white; border-left: 2px solid #16FF00; padding-left: 10px; opacity: 1 !important; }
    </style>
</head>
<body class="bg-[#050505] text-[#16FF00] overflow-hidden">
    
    <div class="scanline"></div>
    <div class="crt-overlay"></div>

    <header class="md:hidden flex justify-between items-center p-4 border-b border-[#16FF00]/20 bg-[#080808] z-50 relative">
        <div class="text-sm font-bold tracking-widest">AGENT_ECHELON</div>
        <button onclick="toggleMobileMenu()" class="border border-[#16FF00] px-3 py-1 text-xs uppercase hover:bg-[#16FF00] hover:text-black transition-colors">
            [ ACCESS_MENU ]
        </button>
    </header>

    <div class="flex h-screen md:p-2 md:border-4 border-[#16FF00]/10 relative">
        
        <nav id="sidebar" class="hidden md:flex flex-col absolute inset-0 z-40 bg-black/95 md:bg-[#080808] md:relative w-full md:w-72 p-8 md:border-r border-[#16FF00]/20 justify-between transition-all">
            
            <button onclick="toggleMobileMenu()" class="md:hidden absolute top-6 right-6 text-[#16FF00] text-xl font-bold border border-[#16FF00] px-3 py-1 hover:bg-[#16FF00] hover:text-black">[ X ]</button>

            <div>
                <div class="mb-12 border-b border-[#16FF00]/20 pb-4 mt-8 md:mt-0">
                    <h1 class="text-2xl font-black italic tracking-tighter">AGENT_ECHELON</h1>
                    <p class="text-[10px] text-white/40 tracking-[0.2em]">IDENT_VERIFIED // JASON</p>
                </div>

                <ul class="space-y-6" id="main-nav">
                    <li><button onclick="loadSection('home', this); toggleMobileMenu()" class="nav-active uppercase text-sm tracking-widest flex items-center space-x-2 w-full text-left"><span>01</span> <span>Latest Intel</span></button></li>
                    <li><button onclick="loadSection('about', this); toggleMobileMenu()" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity w-full text-left"><span>02</span> <span>Agent Bio</span></button></li>
                    <li><button onclick="loadSection('certs', this); toggleMobileMenu()" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity w-full text-left"><span>03</span> <span>Clearance</span></button></li>
                    <li><button onclick="loadSection('projects', this); toggleMobileMenu()" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity w-full text-left"><span>04</span> <span>Projects</span></button></li>
                    <li><button onclick="loadSection('activities', this); toggleMobileMenu()" class="uppercase text-sm tracking-widest flex items-center space-x-2 opacity-60 hover:opacity-100 transition-opacity w-full text-left"><span>05</span> <span>Field Activities</span></button></li>
                </ul>
            </div>
            
            <div class="text-[9px] opacity-30 mt-8 md:mt-0">UPLINK: STABLE // PH_NODE_03</div>
        </nav>

        <main id="content-display" class="flex-1 bg-[#0a0a0a] p-6 md:p-12 overflow-y-auto relative z-10 w-full">
            </main>
    </div>

    <div id="lightbox" onclick="closeLightbox()" class="fixed inset-0 z-[100] bg-black/90 hidden flex items-center justify-center cursor-zoom-out backdrop-blur-sm p-4">
        
        <div class="relative max-w-7xl max-h-screen border-2 border-[#16FF00] shadow-[0_0_50px_rgba(22,255,0,0.2)] bg-black" onclick="event.stopPropagation()">
            
            <div class="absolute -top-2 -left-2 w-6 h-6 border-t-4 border-l-4 border-[#16FF00]"></div>
            <div class="absolute -bottom-2 -right-2 w-6 h-6 border-b-4 border-r-4 border-[#16FF00]"></div>
    
            <img id="lightbox-img" src="" onclick="closeLightbox()" class="max-h-[90vh] max-w-full object-contain cursor-pointer">
            
            <div onclick="closeLightbox()" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-[#16FF00] bg-black px-4 py-1 border border-[#16FF00] text-xs tracking-[0.2em] font-mono animate-pulse cursor-pointer hover:bg-[#16FF00] hover:text-black">
                >> CLICK_TO_CLOSE_FILE
            </div>
        </div>
    </div>

    <script>
        // --- 1. MOBILE MENU LOGIC ---
        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            // Only toggle on mobile screens (less than 768px wide)
            if (window.innerWidth < 768) {
                if (sidebar.classList.contains('hidden')) {
                    sidebar.classList.remove('hidden'); // Show menu
                } else {
                    sidebar.classList.add('hidden'); // Hide menu
                }
            }
        }

        // --- 2. ACCORDION LOGIC (Open/Close Folders) ---
        function toggleIntel(id) {
            const panel = document.getElementById(id);
            const arrow = document.getElementById('arrow-' + id);
            
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                arrow.innerText = "[-]"; 
            } else {
                panel.classList.add('hidden');
                arrow.innerText = "[+]"; 
            }
        }

        // --- 3. LIGHTBOX LOGIC ---
        function openLightbox(imageSrc) {
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = imageSrc;
            lightbox.classList.remove('hidden');
        }

        function closeLightbox() {
            // Hide the Lightbox
            document.getElementById('lightbox').classList.add('hidden');

            // AUTO-CLOSE FEATURE: Find and Close all Open Evidence Panels behind the scenes
            const allPanels = document.querySelectorAll('[id^="evidence-"]');
            
            allPanels.forEach(panel => {
                if (!panel.classList.contains('hidden')) {
                    panel.classList.add('hidden'); // Force close
                    
                    // Reset the [+] arrow
                    const arrowId = 'arrow-' + panel.id;
                    const arrow = document.getElementById(arrowId);
                    if (arrow) arrow.innerText = "[+]";
                }
            });
        }

        // --- 4. CONTENT LOADING LOGIC ---
        async function loadSection(sectionName, element) {
            // Update Navigation UI
            document.querySelectorAll('#main-nav button').forEach(btn => {
                btn.classList.remove('nav-active', 'opacity-100');
                btn.classList.add('opacity-60');
            });
            element.classList.add('nav-active', 'opacity-100');
            element.classList.remove('opacity-60');

            // Fetch Content
            try {
                const response = await fetch(`sections/${sectionName}.html`);
                const html = await response.text();
                document.getElementById('content-display').innerHTML = html;
            } catch (err) {
                document.getElementById('content-display').innerHTML = `<p class="text-red-500">ERROR: DATA_CORRUPTED // FILE_NOT_FOUND</p>`;
            }
        }

        // Initial Boot Sequence
        window.onload = () => {
            const firstBtn = document.querySelector('#main-nav button');
            if(firstBtn) loadSection('home', firstBtn);
        };


        // --- 5. GLITCH EFFECT LOGIC ---
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890@#$%&";

    function runGlitch(element) {
        // Prevent speed-up if already running
        if (element.dataset.animating === "true") return;
        
        element.dataset.animating = "true";
        
        // We get the hidden text ONLY to know how long the glitch bar should be
        const originalText = element.dataset.value; 
        
        clearInterval(element.interval);

        element.interval = setInterval(() => {
            element.innerText = originalText
                .split("")
                .map((letter) => {
                    // PRESERVE SPACES (so it looks like sentences)
                    if(letter === " ") return " "; 
                    
                    // ALWAYS RETURN RANDOM CHARACTERS. NEVER RETURN THE REAL LETTER.
                    return letters[Math.floor(Math.random() * letters.length)];
                })
                .join("");
            
        }, 50); // Speed of the scrambling
    }

    function hideGlitch(element) {
        clearInterval(element.interval);
        // Instantly snap back to Classified
        element.innerText = "[ // CLASSIFIED // ]";
        element.dataset.animating = "false";
    }

    </script>
</body>
</html>
